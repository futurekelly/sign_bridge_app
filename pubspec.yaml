name: sign_bridge
description: AI-Based Two-Way Sign Language Recognition and Speech Translation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  provider: ^6.1.1

  # 🆕 Phase 2 additions
        # WebRTC peer connection + media
  flutter_webrtc: ^1.4.1
  permission_handler: ^11.3.1    # Camera + mic runtime permissions

  # 🆕 Phase 3 additions
  cloud_firestore: 5.6.12
  firebase_storage: ^12.3.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.1

 # 🆕 Phase 4 — AI services
  speech_to_text: ^7.0.0       # STT
  flutter_tts: ^4.0.2             # TTS
  tflite_flutter: ^0.12.1         # On-device gesture model (used later)
  camera: ^0.10.6                 # Camera frames for gesture pipeline
  hive: ^2.2.3                    # Local history storage
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  image: ^4.1.3                   # Image processing for TFLite
  uuid: ^4.4.0

  # 🆕 Upgrade — UI + Learning
  url_launcher: ^6.2.5           # Open PDF resources externally
  torch_light: ^1.1.0            # Real LED torch for deaf incoming-call alerts
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/gifs/
    - assets/labels/
    - assets/models/
    # NOTE: assets/branding/ is deliberately NOT listed here. Those 1024x1024
    # PNGs are build-time sources for the launcher icon and the splash screen;
    # flutter_launcher_icons and flutter_native_splash read them from disk.
    # Declaring them as assets would bundle ~180KB of source artwork into the
    # APK where nothing at runtime ever reads it.

# ── Launcher icon ──────────────────────────────────────────────────────────
# Regenerate the source layers with tools/generate_brand_icon.py, then run:
#   dart run flutter_launcher_icons
# To swap in real artwork, replace assets/branding/icon_source_1024.png (and
# the two adaptive layers) and re-run that same command. Nothing else changes.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon_source_1024.png"
  # Adaptive icon (Android 8+). The foreground is the glyph alone at 42% of the
  # canvas, inside the 66% safe zone, so a round or squircle mask cannot clip
  # it. The gradient sits full-bleed behind it.
  adaptive_icon_background: "assets/branding/icon_background_1024.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground_1024.png"
  min_sdk_android: 26

# ── Splash screen ──────────────────────────────────────────────────────────
# Regenerate with: dart run flutter_native_splash:create
# The dark variant matters: without it a dark-theme launch shows a white splash
# and then snaps to a dark UI.
flutter_native_splash:
  color: "#2563EB"                 # AppColors.primary, matches NormalTheme
  image: assets/branding/splash_logo.png
  color_dark: "#0F172A"            # AppColors.darkBg
  image_dark: assets/branding/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    image: assets/branding/splash_logo.png
    color: "#2563EB"
    color_dark: "#0F172A"
    icon_background_color: "#2563EB"
    icon_background_color_dark: "#0F172A"